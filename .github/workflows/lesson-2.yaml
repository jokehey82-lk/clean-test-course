name: Lesson 2

on:
  push:
    branches:
      - lesson-2
jobs:
  deploy:
    needs: [unit_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/hangry_api/settings.py
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install test environment
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest django_mock_queries six coverage
          coverage run --source=./hangry_api -m pytest
        working-directory: backend
      - name: Run unit tests
        run: |
          coverage run --source=./hangry_api -m pytest
          coverage report
        working-directory: backend